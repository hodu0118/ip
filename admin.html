<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 - 방문 기록</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 20% 20%, #1a1a2e, #0d0d15 70%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Pretendard', sans-serif;
    color: #eaeaf0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* 로그인 화면 */
  .login-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 56px 48px;
    text-align: center;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    min-width: 320px;
  }
  .login-card .title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #7dd3fc, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .login-card .sub {
    font-size: 13px;
    color: #8a8aa3;
    margin-bottom: 32px;
  }
  .google-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    color: #1f1f1f;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .google-btn:hover { transform: translateY(-1px); }
  .google-btn:active { transform: scale(0.98); }
  .denied {
    margin-top: 20px;
    color: #f87171;
    font-size: 13px;
  }

  /* 대시보드 화면 */
  .dashboard {
    width: 100%;
    max-width: 960px;
    display: none;
  }
  .dashboard.show { display: block; }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }
  .header .title {
    font-size: 20px;
    font-weight: 700;
  }
  .header .user-info {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: #b4b4c8;
  }
  .logout-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #eaeaf0;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .logout-btn:hover { background: rgba(255,255,255,0.1); }

  .table-wrap {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    padding: 14px 16px;
    background: rgba(255,255,255,0.05);
    color: #8a8aa3;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  tbody td {
    padding: 12px 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
    color: #eaeaf0;
  }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  .ip-cell { font-weight: 600; color: #7dd3fc; }
  .empty, .loading {
    padding: 40px;
    text-align: center;
    color: #71718f;
    font-size: 13px;
  }
  .refresh-btn {
    margin-bottom: 16px;
    background: rgba(125, 211, 252, 0.12);
    border: 1px solid rgba(125, 211, 252, 0.3);
    color: #7dd3fc;
    padding: 8px 18px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .refresh-btn:hover { background: rgba(125, 211, 252, 0.2); }
  .count-badge {
    color: #71718f;
    font-size: 12px;
    margin-left: 8px;
  }
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: #b4b4c8;
  }
  .switch {
    position: relative;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: rgba(255,255,255,0.15);
    border-radius: 22px;
    transition: 0.2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    height: 16px;
    width: 16px;
    left: 3px;
    bottom: 3px;
    background: #eaeaf0;
    border-radius: 50%;
    transition: 0.2s;
  }
  .switch input:checked + .slider {
    background: linear-gradient(135deg, #7dd3fc, #a78bfa);
  }
  .switch input:checked + .slider::before {
    transform: translateX(18px);
  }
  .bot-badge {
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 6px;
    background: rgba(248, 113, 113, 0.15);
    color: #f87171;
    font-weight: 600;
    vertical-align: middle;
  }
  tr.is-bot { opacity: 0.55; }
</style>
</head>
<body>

  <div class="login-card" id="loginCard">
    <div class="title">관리자 로그인</div>
    <div class="sub">방문 기록을 보려면 관리자 계정으로 로그인하세요</div>
    <button class="google-btn" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Google로 로그인
    </button>
    <div class="denied" id="deniedMsg" style="display:none;">관리자 계정이 아닙니다. 접근 권한이 없어요.</div>
  </div>

  <div class="dashboard" id="dashboard">
    <div class="header">
      <div class="title">방문 기록 <span class="count-badge" id="countBadge"></span></div>
      <div class="user-info">
        <span id="userEmail"></span>
        <button class="logout-btn" onclick="logout()">로그아웃</button>
      </div>
    </div>
    <div class="toolbar">
      <button class="refresh-btn" onclick="loadVisits()">새로고침</button>
      <div class="toggle-wrap">
        <span>봇으로 추정되는 접속 숨기기</span>
        <label class="switch">
          <input type="checkbox" id="hideBotToggle" onchange="onToggleChange()">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>시간</th>
            <th>IP</th>
            <th>위치</th>
            <th>ISP</th>
            <th>User Agent</th>
          </tr>
        </thead>
        <tbody id="visitsBody">
          <tr><td colspan="5" class="loading">불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://sofajxssivrdqpucwjkp.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNvZmFqeHNzaXZyZHFwdWN3amtwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NjMyNzQsImV4cCI6MjEwMzEzOTI3NH0.YXyDBOTGnOtK7fTjRa49XebNkeXU31yx0rVp2bNUJqQ';
  const ADMIN_EMAIL = 'taeorange79@gmail.com';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { flowType: 'pkce' }
  });

  let allVisits = [];

  const BOT_ISP_KEYWORDS = [
    'hosting', 'host', 'cloud', 'data center', 'datacenter', 'server',
    'vps', 'technologies', 'digitalocean', 'amazon', 'aws', 'google cloud',
    'azure', 'ovh', 'hetzner', 'linode', 'vultr', 'alibaba', 'colocation',
    'cdn', 'proxy', 'vpn'
  ];
  const BOT_UA_KEYWORDS = [
    'bot', 'crawler', 'spider', 'curl', 'python', 'wget', 'scrapy',
    'headless', 'go-http-client', 'java/', 'okhttp', 'axios', 'node-fetch',
    'postman', 'libwww', 'httpclient'
  ];

  function isLikelyBot(row) {
    const isp = (row.isp || '').toLowerCase();
    const ua = (row.user_agent || '').toLowerCase();
    if (BOT_ISP_KEYWORDS.some(k => isp.includes(k))) return true;
    if (BOT_UA_KEYWORDS.some(k => ua.includes(k))) return true;
    return false;
  }

  function onToggleChange() {
    const checked = document.getElementById('hideBotToggle').checked;
    localStorage.setItem('hideBotVisits', checked ? '1' : '0');
    renderVisits();
  }

  async function loginWithGoogle() {
    const cleanUrl = window.location.origin + window.location.pathname;
    await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: cleanUrl }
    });
  }

  async function logout() {
    await sb.auth.signOut();
    document.getElementById('dashboard').classList.remove('show');
    document.getElementById('loginCard').style.display = 'block';
    document.getElementById('deniedMsg').style.display = 'none';
  }

  async function loadVisits() {
    const tbody = document.getElementById('visitsBody');
    tbody.innerHTML = '<tr><td colspan="5" class="loading">불러오는 중...</td></tr>';

    const { data, error } = await sb
      .from('visits')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(500);

    if (error) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty">불러오기 실패: ${error.message}</td></tr>`;
      return;
    }

    allVisits = data || [];
    renderVisits();
  }

  function renderVisits() {
    const tbody = document.getElementById('visitsBody');
    const hideBots = document.getElementById('hideBotToggle').checked;
    const rows = hideBots ? allVisits.filter(r => !isLikelyBot(r)) : allVisits;

    if (rows.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" class="empty">${allVisits.length === 0 ? '아직 방문 기록이 없습니다.' : '표시할 기록이 없습니다 (봇 숨김 중).'}</td></tr>`;
      document.getElementById('countBadge').textContent = '';
      return;
    }

    const botCount = allVisits.filter(isLikelyBot).length;
    document.getElementById('countBadge').textContent =
      `총 ${allVisits.length}건${botCount ? ` · 봇 추정 ${botCount}건` : ''}`;

    tbody.innerHTML = rows.map(row => {
      const t = new Date(row.created_at).toLocaleString('ko-KR');
      const ua = (row.user_agent || '-').length > 60 ? row.user_agent.slice(0, 60) + '...' : (row.user_agent || '-');
      const bot = isLikelyBot(row);
      return `<tr class="${bot ? 'is-bot' : ''}">
        <td>${t}</td>
        <td class="ip-cell">${row.ip || '-'}${bot ? '<span class="bot-badge">BOT?</span>' : ''}</td>
        <td>${row.location || '-'}</td>
        <td>${row.isp || '-'}</td>
        <td title="${row.user_agent || ''}">${ua}</td>
      </tr>`;
    }).join('');
  }

  async function checkSession() {
    const { data: { session } } = await sb.auth.getSession();

    if (session && session.user && session.user.email === ADMIN_EMAIL) {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('dashboard').classList.add('show');
      document.getElementById('userEmail').textContent = session.user.email;
      document.getElementById('hideBotToggle').checked = localStorage.getItem('hideBotVisits') === '1';
      // 주소창에 남은 access_token/code 등 노출 방지: URL을 깔끔하게 정리
      if (window.location.hash || window.location.search) {
        history.replaceState(null, '', window.location.pathname);
      }
      loadVisits();
    } else if (session && session.user) {
      // 로그인은 했지만 관리자 계정이 아님
      document.getElementById('deniedMsg').style.display = 'block';
      if (window.location.hash || window.location.search) {
        history.replaceState(null, '', window.location.pathname);
      }
      await sb.auth.signOut();
    }
  }

  sb.auth.onAuthStateChange((event, session) => {
    checkSession();
  });

  checkSession();
</script>
</body>
</html>
